<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>STW-Verify — Admin Login</title>
<link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
<link rel="apple-touch-icon" href="/brand/logo-icon.svg" />
<style>
  :root{
    --brand:#0b6e4f; --brand-light:#128a63; --brand-ring:rgba(11,110,79,.18);
    --ink:#131a21; --muted:#66727f; --line:#e3e8ef; --bg:#eef2f7;
    --err:#b3261e; --err-bg:#fdeceb; --ok:#0b6e4f; --ok-bg:#e7f6ee;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; display:grid; place-items:center; padding:24px;
    background:
      radial-gradient(1100px 600px at 12% -10%, #d7ece3 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 110%, #dbe6f5 0%, transparent 55%),
      var(--bg);
    font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink); -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%; max-width:404px; background:#fff; border:1px solid var(--line);
    border-radius:20px; padding:38px 34px 30px;
    box-shadow:0 1px 2px rgba(16,24,40,.04), 0 18px 50px -12px rgba(16,24,40,.16);
    animation:rise .45s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.card{animation:none}}

  .logo{
    width:76px;height:76px;margin:0 auto 14px;display:block;
    filter:drop-shadow(0 10px 22px rgba(11,110,79,.35));
  }
  .logo img{width:76px;height:76px;display:block}
  h1{
    font-size:22px;letter-spacing:-.3px;text-align:center;margin:0 0 6px;font-weight:700;
  }
  h1 .accent{color:var(--brand)}
  .sub{text-align:center;color:var(--muted);font-size:13.5px;margin:0 0 26px}

  .field{margin-bottom:16px}
  label{display:block;font-size:12.5px;font-weight:600;letter-spacing:.02em;margin-bottom:7px;color:#39424e}
  .control{position:relative}
  input[type=email],input[type=password],input[type=text]{
    width:100%;border:1px solid var(--line);border-radius:11px;
    padding:13px 44px 13px 14px;font:inherit;font-size:14.5px;background:#fbfcfe;color:var(--ink);
    transition:border-color .15s, box-shadow .15s, background .15s;
  }
  input::placeholder{color:#a6b0bd}
  input:hover{border-color:#cfd8e3}
  input:focus{outline:none;border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px var(--brand-ring)}
  input:disabled{opacity:.6;cursor:not-allowed}

  .toggle{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    background:none;border:0;cursor:pointer;padding:8px;border-radius:8px;
    color:var(--muted);display:grid;place-items:center;line-height:0;
  }
  .toggle:hover{background:#f0f4f8;color:var(--ink)}
  .toggle:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
  .toggle svg{width:19px;height:19px}

  button[type=submit]{
    width:100%;margin-top:22px;padding:13px 16px;border:0;border-radius:11px;cursor:pointer;
    background:linear-gradient(180deg,var(--brand-light),var(--brand));
    color:#fff;font:inherit;font-size:15px;font-weight:600;letter-spacing:.01em;
    box-shadow:0 6px 16px -6px rgba(11,110,79,.6);
    transition:filter .15s, transform .06s, box-shadow .15s;
  }
  button[type=submit]:hover{filter:brightness(1.05)}
  button[type=submit]:active{transform:translateY(1px)}
  button[type=submit]:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
  button[type=submit][aria-busy="true"]{cursor:progress;filter:saturate(.8)}

  .spinner{
    width:15px;height:15px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
    border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:8px;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  #msg{
    margin-top:16px;padding:11px 14px;border-radius:10px;font-size:13.5px;
    display:none;text-align:center;line-height:1.45;
  }
  #msg.err{display:block;background:var(--err-bg);color:var(--err);border:1px solid #f6cfcc}
  #msg.ok{display:block;background:var(--ok-bg);color:var(--ok);border:1px solid #bfe5d4}

  .hint{
    text-align:center;color:var(--muted);font-size:12.5px;margin-top:20px;
    padding-top:16px;border-top:1px solid #f0f3f7;
  }
  .hint code{background:#f2f5f9;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12px;color:#3d4a58}
  .hint.configured{color:var(--ok);border-top-color:#e3f1ea}
  .hint.configured code{display:none}
</style>
</head>
<body>
<main class="card">
  <div class="logo"><img src="/brand/logo-mark.svg" alt="STW-Verify" /></div>
  <h1>STW<span class="accent">-Verify</span></h1>
  <p class="sub">Sign in to manage your OTP settings</p>

  <form id="loginForm" novalidate autocomplete="on">
    <div class="field">
      <label for="email">Email address</label>
      <div class="control">
        <input type="email" id="email" name="email" placeholder="admin@gmail.com"
               autocomplete="username" required aria-required="true" />
      </div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="control">
        <input type="password" id="password" name="password" placeholder="Enter your password"
               autocomplete="current-password" required aria-required="true" />
        <button type="button" class="toggle" id="togglePass" aria-label="Show password" aria-pressed="false">
          <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <button type="submit" id="submitBtn">Sign in</button>
  </form>

  <div id="msg" role="alert" aria-live="polite"></div>

  <p class="hint" id="hint">Default login: <code>admin@gmail.com</code> / <code>admin123</code></p>
</main>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const form = $('loginForm');
  const emailEl = $('email');
  const passEl = $('password');
  const msg = $('msg');
  const btn = $('submitBtn');
  const hint = $('hint');

  // Password visibility toggle
  $('togglePass').addEventListener('click', () => {
    const showing = passEl.type === 'text';
    passEl.type = showing ? 'password' : 'text';
    const t = $('togglePass');
    t.setAttribute('aria-pressed', String(!showing));
    t.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    $('eyeIcon').style.opacity = showing ? '1' : '.55';
    passEl.focus({ preventScroll: true });
  });

  function show(kind, text) {
    msg.className = kind;
    msg.textContent = text;
  }
  function setBusy(busy) {
    btn.disabled = busy;
    emailEl.disabled = busy;
    passEl.disabled = busy;
    btn.setAttribute('aria-busy', String(busy));
    btn.innerHTML = busy ? '<span class="spinner"></span>Signing in…' : 'Sign in';
  }

  // Detect whether defaults are still active
  fetch('/api/auth/status')
    .then((r) => r.json())
    .then((d) => {
      if (d && d.success && d.configured) {
        hint.className = 'hint configured';
        hint.textContent = 'Use the admin credentials you configured.';
      }
    })
    .catch(() => {});

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = '';

    const email = emailEl.value.trim();
    const password = passEl.value;

    if (!email) return show('err', 'Please enter your email address.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return show('err', 'That email address looks invalid.');
    if (!password) return show('err', 'Please enter your password.');

    setBusy(true);
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        show('err', data.message || 'Invalid email or password.');
        setBusy(false);
        passEl.select();
        return;
      }

      show('ok', 'Signed in — redirecting…');
      setTimeout(() => { window.location.href = '/settings'; }, 450);
    } catch (err) {
      show('err', 'Cannot reach the server. Check your connection and try again.');
      setBusy(false);
    }
  });
})();
</script>
</body>
</html>
