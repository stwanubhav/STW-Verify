<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STW-Verify — Admin Login</title>
<style>
  :root{--brand:#0b6e4f;--ink:#1a2027;--muted:#5b6672;--line:#e4e8ee;--bg:#f6f8fb;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:Segoe UI,system-ui,-apple-system,sans-serif;color:var(--ink)}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:36px 34px;width:380px;max-width:92vw;box-shadow:0 12px 40px rgba(16,24,40,.08)}
  .logo{width:52px;height:52px;border-radius:14px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:24px;margin:0 auto 14px}
  h1{font-size:20px;text-align:center;margin:0 0 4px}
  .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px}
  label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
  input[type=email],input[type=password]{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;background:#fff}
  input:focus{outline:2px solid #a7d4c4;border-color:var(--brand)}
  button{cursor:pointer;width:100%;background:var(--brand);color:#fff;border:none;border-radius:10px;padding:13px;font:inherit;font-weight:600;margin-top:22px}
  button:hover{filter:brightness(1.08)}
  #msg{padding:10px 14px;border-radius:8px;margin-top:16px;font-size:13px;display:none;text-align:center}
  #msg.err{display:block;background:#fde8e8;color:#b3261e}
  #msg.ok{display:block;background:#e7f6ee;color:#0b6e4f}
  .hint{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">SV</div>
  <h1>STW-Verify</h1>
  <div class="sub">Admin login to manage settings</div>

  <form id="loginForm" autocomplete="on">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="admin@gmail.com" autocomplete="username" required />
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
    <button type="submit">Sign in</button>
  </form>
  <div id="msg"></div>
  <div class="hint" id="hint">Default: admin@gmail.com / admin123</div>
</div>

<script>
  const $ = (id) => document.getElementById(id);

  (async () => {
    try {
      const r = await fetch('/api/auth/status');
      const data = await r.json();
      if (data.success && data.configured) {
        document.getElementById('hint').textContent = 'Use your configured admin credentials.';
        document.getElementById('hint').style.color = '#0b6e4f';
      }
    } catch {}
  })();

  $('loginForm').onsubmit = async (e) => {
    e.preventDefault();
    const msg = $('msg');
    msg.className = '';

    const email = $('email').value.trim();
    const password = $('password').value;

    try {
      const r = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.message || 'Login failed');
      msg.className = 'ok';
      msg.textContent = 'Login successful — redirecting…';
      setTimeout(() => { window.location.href = '/settings'; }, 500);
    } catch (err) {
      msg.className = 'err';
      msg.textContent = err.message;
    }
  };
</script>
</body>
</html>
